name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all --deny-warn

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/*/; do
            if grep -q 'kind: "executable"' "$dir/moon.pkg" && ! grep -q 'supported_targets = "js"' "$dir/moon.pkg"; then
              moon run "$dir" --target native > /dev/null
            fi
          done

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            case "$dir" in *CHANGE-ME*) continue ;; esac
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      # A reader pastes the blocks of the README and the skills into a project, so they have
      # to compile as written, against this commit's source.
      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: python3 scripts/check_snippets.py

      # The reference is generated from the interface and the doc comments, so
      # a change to either without regenerating is a stale page on the site.
      - name: api reference is up to date
        if: ${{ runner.os == 'Linux' }}
        run: |
          python3 scripts/api.py
          if [ -n "$(git status --porcelain -- docs/api)" ]; then
            git status --short -- docs/api
            echo "::error::docs/api is stale; run 'python3 scripts/api.py' and commit the result"
            exit 1
          fi

  # Both directions against the two implementations the module interoperates
  # with: the fixtures under src/ are messages Python and Go wrote, and this job
  # writes them again from those peers at the pinned versions, then has both
  # peers read the messages src/examples/wire writes. Replaying the checked-in
  # bytes in the test suite cannot see a peer that changed its mind; this can.
  interop:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/go.mod
          cache-dependency-path: scripts/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # The peers are not dependencies of the module, so they live outside the
      # interpreter the rest of the workflow uses.
      - name: install pyfory, the Python peer
        run: |
          python3 -m venv "$RUNNER_TEMP/peer"
          "$RUNNER_TEMP/peer/bin/pip" install pyfory==1.7.7
          echo "$RUNNER_TEMP/peer/bin" >> "$GITHUB_PATH"

      - name: the fixtures are what the peers write
        run: |
          moon update
          python3 scripts/interop.py
          (cd scripts && go run .)
          moon fmt
          git diff --exit-code src/fixtures_pyfory_test.mbt src/fixtures_go_test.mbt

      - name: the peers read what this package writes
        run: |
          moon run src/examples/wire --target native > "$RUNNER_TEMP/wire.tsv"
          python3 scripts/check_peer_reads.py "$RUNNER_TEMP/wire.tsv"
          (cd scripts && go run ./check_peer_reads "$RUNNER_TEMP/wire.tsv")
